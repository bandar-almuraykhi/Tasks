<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Day 2 - HTML</title>
</head>
<body>

<!-- Heading and Paragraph -->
<h1>HTML Tables and Forms</h1>

<p>This page demonstrates HTML tables and registration forms.</p>

<!-- Tables , rowspan and colspan -->
<h2>Weekly Study Schedule</h2>

<table border="1"> 
    <thead>
        <tr>
            <th>Day</th>
            <th>Topic</th>
            <th>Hours</th>
        </tr>
    </thead>

<tbody>
    <tr>
        <td rowspan="2">Sunday</td>
        <td>HTML</td>
        <td>3</td>
    </tr>

    <tr>
        <td>CSS</td>
        <td>2</td>
    </tr>

    <tr>
        <td>Monday</td>
        <td>Python</td>
        <td>4</td>
    </tr>

    <tr>
        <td>Tuesday</td>
        <td>MySQL</td>
        <td>2</td>
    </tr>

    <tr>
        <td colspan="3">Total Study Hours: 11</td>
    </tr>
</tbody>

</table>

<!-- Form , input , label , placeholder , required -->
<h2>Registration Form</h2>

<form>
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" placeholder="Enter your name" required>

    <br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="Enter your email" required>

    <br><br>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" placeholder="Enter your password">

    <!-- Radio -->
<h3>Experience Level</h3>

<input type="radio" id="beginner" name="level" value="beginner">
<label for="beginner">Beginner</label>

<br>

<input type="radio" id="intermediate" name="level" value="intermediate">
<label for="intermediate">Intermediate</label>

<br>

<input type="radio" id="advanced" name="level" value="advanced">
<label for="advanced">Advanced</label>


<!-- checkbox -->
<h3>Interested Topics</h3>

<input type="checkbox" id="html" name="topics" value="html">
<label for="html">HTML</label>

<br>

<input type="checkbox" id="css" name="topics" value="css">
<label for="css">CSS</label>

<br>

<input type="checkbox" id="javascript" name="topics" value="javascript">
<label for="javascript">JavaScript</label>

<!-- Select and option -->
<h3>Select City</h3>

<label for="city">City:</label>

<select id="city" name="city">
    <option value="riyadh">Riyadh</option>
    <option value="jeddah">Jeddah</option>
    <option value="dammam">Dammam</option>
</select>

<!-- Textarea -->
<h3>Additional Notes</h3>

<label for="notes">Notes:</label>
<br>
<textarea id="notes" name="notes" rows="4" cols="40"></textarea>

<!-- Submit Button -->
<br><br>
<button type="submit">Submit</button>


</form>


</body>
</html>
